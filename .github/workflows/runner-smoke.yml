name: Runner Smoke Test

on:
  push:
    branches:
      - director-sierra-v10-demo-photographic-engine
    paths:
      - '.github/workflows/runner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux runner smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Runner started
        run: echo "linux-runner-ok"
      - uses: actions/checkout@v4
      - name: Confirm Director project
        run: test -f Director/gradlew && test -f Director/settings.gradle.kts

  windows:
    name: Windows runner smoke
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Runner started
        shell: pwsh
        run: Write-Host "windows-runner-ok"
      - uses: actions/checkout@v4
      - name: Confirm Director project
        shell: pwsh
        run: |
          if (!(Test-Path 'Director/gradlew.bat')) { throw 'gradlew.bat missing' }
          if (!(Test-Path 'Director/settings.gradle.kts')) { throw 'settings.gradle.kts missing' }

  macos:
    name: macOS runner smoke
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Runner started
        run: echo "macos-runner-ok"
      - uses: actions/checkout@v4
      - name: Confirm Director project
        run: test -f Director/gradlew && test -f Director/settings.gradle.kts
