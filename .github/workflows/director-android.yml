name: Director Android Qualification

on:
  push:
    branches:
      - director-gemini-v1
      - director-sierra-v3
      - director-sierra-v4-camera-os
      - director-sierra-v5-temporal-scene
      - director-sierra-v6-subject-intelligence
      - director-sierra-v7-prif
      - director-sierra-v8-anip
      - director-sierra-v10-cognition
      - director-sierra-v10-demo-photographic-engine
    paths:
      - 'Director/**'
      - '.github/workflows/director-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Director/**'
      - '.github/workflows/director-android.yml'
  workflow_dispatch:
    inputs:
      release_qualification:
        description: 'Build and verify signed release APK/AAB'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: director-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test, lint and build debug APK
    if: github.event_name != 'workflow_dispatch' || inputs.release_qualification == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: Director

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            Director/**/*.gradle*
            Director/gradle.properties
            Director/settings.gradle.kts

      - name: Use preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" version

      - name: Compile Kotlin first
        shell: bash
        run: ./gradlew --no-daemon --stacktrace --max-workers=3 compileDebugKotlin

      - name: Unit tests, lint and APK build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=4 testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -qE '(^|[[:space:]])classes\.dex$'
          cp "$APK" "$GITHUB_WORKSPACE/Director-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/Director-debug.apk" | tee "$GITHUB_WORKSPACE/Director-debug.apk.sha256"

      - name: Upload Director APK
        uses: actions/upload-artifact@v4
        with:
          name: Director-debug-apk
          path: |
            Director-debug.apk
            Director-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Director-build-diagnostics
          path: |
            Director/app/build/reports/**
            Director/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

  build-release:
    name: Signed release APK/AAB qualification
    if: github.event_name == 'workflow_dispatch' && inputs.release_qualification == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 'true'
      CM_KEYSTORE_PASSWORD: ${{ secrets.DIRECTOR_KEYSTORE_PASSWORD }}
      CM_KEY_ALIAS: ${{ secrets.DIRECTOR_KEY_ALIAS }}
      CM_KEY_PASSWORD: ${{ secrets.DIRECTOR_KEY_PASSWORD }}

    defaults:
      run:
        working-directory: Director

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            Director/**/*.gradle*
            Director/gradle.properties
            Director/settings.gradle.kts

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew

      - name: Materialize signing keystore
        shell: bash
        env:
          DIRECTOR_KEYSTORE_BASE64: ${{ secrets.DIRECTOR_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${DIRECTOR_KEYSTORE_BASE64:-}"
          test -n "${CM_KEYSTORE_PASSWORD:-}"
          test -n "${CM_KEY_ALIAS:-}"
          test -n "${CM_KEY_PASSWORD:-}"
          KEYSTORE="$RUNNER_TEMP/director-release.jks"
          printf '%s' "$DIRECTOR_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CM_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEYSTORE" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" >/dev/null

      - name: Release tests and lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=4 testDebugUnitTest lintRelease

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=4 assembleRelease bundleRelease

      - name: Verify signed release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          jarsigner -verify -strict "$AAB" >/dev/null
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/release-artifacts/Director-release.apk"
          cp "$AAB" "$GITHUB_WORKSPACE/release-artifacts/Director-release.aab"
          sha256sum "$GITHUB_WORKSPACE/release-artifacts/Director-release.apk" "$GITHUB_WORKSPACE/release-artifacts/Director-release.aab" | tee "$GITHUB_WORKSPACE/release-artifacts/SHA256SUMS.txt"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Director-signed-release
          path: release-artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Director-release-diagnostics
          path: |
            Director/app/build/reports/**
            Director/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3
