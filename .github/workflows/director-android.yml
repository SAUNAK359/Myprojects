name: Build Director APK

on:
  push:
    branches:
      - director-gemini-v1
      - director-sierra-v3
      - director-sierra-v4-camera-os
      - director-sierra-v5-temporal-scene
      - director-sierra-v6-subject-intelligence
      - director-sierra-v7-prif
      - director-sierra-v8-anip
      - director-sierra-v10-cognition
      - director-sierra-v10-demo-photographic-engine
      - director-sierra-v11-memory-anip-fix
    paths:
      - 'Director/**'
      - '.github/workflows/director-android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Director/**'
      - '.github/workflows/director-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: director-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: Director

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            Director/**/*.gradle*
            Director/gradle.properties
            Director/settings.gradle.kts

      - name: Use preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" version

      - name: Compile Kotlin first
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace --max-workers=3 compileDebugKotlin

      - name: Unit tests, lint and APK build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --max-workers=4 \
            testDebugUnitTest \
            lintDebug \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -qE '(^|[[:space:]])classes\.dex$'
          cp "$APK" "$GITHUB_WORKSPACE/Director-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/Director-debug.apk" | tee "$GITHUB_WORKSPACE/Director-debug.apk.sha256"

      - name: Upload Director APK
        uses: actions/upload-artifact@v4
        with:
          name: Director-debug-apk
          path: |
            Director-debug.apk
            Director-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Director-build-diagnostics
          path: |
            Director/app/build/reports/**
            Director/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3
