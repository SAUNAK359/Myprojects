name: Director Android CI

on:
  pull_request:
    paths:
      - 'Director/**'
      - 'codemagic.yaml'
      - '.github/workflows/director-android-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/ndk/28.2.13676358"
          test -d "$SDK_ROOT/cmake/3.22.1"

      - name: Configure Director
        shell: bash
        run: |
          set -euo pipefail
          cd Director
          chmod +x gradlew scripts/*.sh scripts/*.py
          python3 scripts/compile_skills.py
          python3 -m json.tool app/src/main/assets/skills.json >/dev/null
          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT}" > local.properties

      - name: Fetch pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          cd Director
          ./scripts/fetch_llama_cpp.sh

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd Director
          ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          cd Director
          ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd Director
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: director-debug-apk
          path: Director/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
