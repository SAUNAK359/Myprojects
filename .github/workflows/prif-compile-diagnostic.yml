name: P-RIF Compile Diagnostic

on:
  push:
    branches:
      - director-sierra-v7-prif
    paths:
      - 'Director/**'
      - '.github/workflows/prif-compile-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Compile and preserve diagnostics
        shell: bash
        run: |
          set -o pipefail
          cd Director
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --no-parallel --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
            -Pkotlin.compiler.execution.strategy=in-process compileDebugKotlin \
            2>&1 | tee ../prif-compile.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prif-compile-log
          path: prif-compile.log
          if-no-files-found: warn
          retention-days: 3
