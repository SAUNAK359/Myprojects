workflows:
  director-android-debug-v8:
    name: Director Android Debug V8
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $CM_BUILD_DIR/Director/app/.cxx
        - $HOME/.director/kleidiai
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: debug-v8"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current || true)"
          echo "Host: $(uname -a)"
          echo "Bash: ${BASH_VERSION:-unknown}"
          java -version
          df -h "$CM_BUILD_DIR"

      - name: Bootstrap Android native toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x gradlew scripts/*.sh scripts/*.py
          ./scripts/bootstrap_android_sdk.sh

      - name: Deterministic build preflight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./scripts/ci_preflight.sh
          mkdir -p "$CM_BUILD_DIR/director-build-logs"

      - name: Fetch verified llama.cpp
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./scripts/fetch_llama_cpp.sh
          ./scripts/fetch_kleidiai.sh
          test -s third_party/llama.cpp/CMakeLists.txt
          test -s third_party/llama.cpp/include/llama.h
          test -s third_party/llama.cpp/tools/mtmd/mtmd.h
          test -s "$HOME/.director/kleidiai/v1.24.0/CMakeLists.txt"

      - name: Compile debug APK
        script: |
          set +e
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/assemble-debug.log"
          DIRECTOR_GRADLE_TIMEOUT_SEC=4500 ./scripts/run_gradle_ci.sh "$LOG" assembleDebug
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "========== DIRECTOR ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |^w: |C/C\+\+:|(^|[[:space:]])error:|fatal error:|Caused by:|Could not resolve|Execution failed for task|A problem occurred|FAILED|Director timeout|Hard timeout' "$LOG" | head -n 300 || true
            echo "========================================="
            exit "$STATUS"
          fi
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "APK ready: $APK"

      - name: Unit tests
        script: |
          set +e
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/unit-tests.log"
          DIRECTOR_GRADLE_TIMEOUT_SEC=900 ./scripts/run_gradle_ci.sh "$LOG" testDebugUnitTest
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "========== TEST ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |error:|Caused by:|Execution failed for task|FAILED|AssertionError|Director timeout|Hard timeout' "$LOG" | head -n 300 || true
            echo "====================================="
            exit "$STATUS"
          fi

      - name: Android lint report
        script: |
          set +e
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/lint-debug.log"
          DIRECTOR_GRADLE_TIMEOUT_SEC=900 ./scripts/run_gradle_ci.sh "$LOG" lintDebug
          STATUS=$?
          set -e
          TXT="app/build/reports/lint-results-debug.txt"
          if [ -f "$TXT" ]; then
            echo "========== ANDROID LINT FINDINGS =========="
            cat "$TXT"
            echo "==========================================="
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "DEBUG APK remains publishable for device validation; Release V8 remains strict."
            grep -nE '^\* What went wrong:|^e: |error:|Caused by:|Execution failed for task|Fatal:|Director timeout|Hard timeout' "$LOG" | head -n 300 || true
          fi
          exit 0

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/reports/lint-results-*.html
      - Director/app/build/reports/lint-results-*.txt
      - Director/app/build/reports/lint-results-*.xml
      - Director/app/build/test-results/**/*.xml
      - director-build-logs/**/*.log

  director-android-release-v8:
    name: Director Android Release V8
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $CM_BUILD_DIR/Director/app/.cxx
        - $HOME/.director/kleidiai
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: release-v8"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Bash: ${BASH_VERSION:-unknown}"
          java -version
          df -h "$CM_BUILD_DIR"

      - name: Bootstrap and preflight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x gradlew scripts/*.sh scripts/*.py
          ./scripts/bootstrap_android_sdk.sh
          ./scripts/ci_preflight.sh
          mkdir -p "$CM_BUILD_DIR/director-build-logs"
          ./scripts/fetch_llama_cpp.sh
          ./scripts/fetch_kleidiai.sh
          test -s third_party/llama.cpp/CMakeLists.txt
          test -s third_party/llama.cpp/include/llama.h
          test -s third_party/llama.cpp/tools/mtmd/mtmd.h
          test -s "$HOME/.director/kleidiai/v1.24.0/CMakeLists.txt"

      - name: Build and verify release
        script: |
          set +e
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/release.log"
          DIRECTOR_GRADLE_TIMEOUT_SEC=5100 ./scripts/run_gradle_ci.sh "$LOG" \
            assembleRelease bundleRelease testReleaseUnitTest lintRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            TXT="app/build/reports/lint-results-release.txt"
            if [ -f "$TXT" ]; then cat "$TXT"; fi
            echo "========== RELEASE ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |C/C\+\+:|error:|fatal error:|Caused by:|Could not resolve|Execution failed for task|A problem occurred|Fatal:|FAILED|Director timeout|Hard timeout' "$LOG" | head -n 360 || true
            echo "========================================"
            exit "$STATUS"
          fi
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          echo "Release APK: $APK"
          echo "Release AAB: $AAB"

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/outputs/**/*.aab
      - Director/app/build/reports/lint-results-*.html
      - Director/app/build/reports/lint-results-*.txt
      - Director/app/build/reports/lint-results-*.xml
      - director-build-logs/**/*.log
