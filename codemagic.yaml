workflows:
  director-mode-android:
    name: Director V3 Autonomous Offline Camera APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Verify committed Director V3 source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          require_file() {
            local path="$1"
            if [ ! -f "$path" ]; then
              echo "ERROR: required committed file is missing: $path" >&2
              exit 1
            fi
            echo "OK file: $path"
          }

          require_grep() {
            local pattern="$1"
            local path="$2"
            local label="$3"
            if ! grep -Eq "$pattern" "$path"; then
              echo "ERROR: source contract failed: $label" >&2
              echo "File: $path" >&2
              echo "Expected pattern: $pattern" >&2
              exit 1
            fi
            echo "OK contract: $label"
          }

          require_file director-mode-android/settings.gradle.kts
          require_file director-mode-android/build.gradle.kts
          require_file director-mode-android/app/build.gradle.kts
          require_file director-mode-android/app/src/main/AndroidManifest.xml
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/MainActivity.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/camera/CameraEngine.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/camera/CameraCapabilities.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/core/PhotoPlan.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/director/AutonomousPhotoDirector.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/director/StrictPhotoPlanValidator.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/director/BoundedPhotoReadinessEvaluator.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/director/FallbackPhotoPlanner.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/ml/VisionPipeline.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/ml/FrameAnalyzer.kt
          require_file director-mode-android/app/src/main/java/ai/auraforge/director/ui/DirectorOverlayView.kt
          require_file director-mode-android/app/src/main/res/drawable/bg_shutter_ready.xml
          require_file director-mode-android/DIRECTOR_V3_ARCHITECTURE.md
          require_file director-mode-android/app/src/main/assets/shot_templates.json
          require_file director-mode-android/app/src/main/assets/director_config.json
          require_file director-mode-android/app/src/main/res/layout/activity_main.xml

          if grep -R --line-number 'id("org.jetbrains.kotlin.android")\|kotlinOptions' director-mode-android/*.gradle.kts director-mode-android/app/*.gradle.kts; then
            echo 'ERROR: legacy Kotlin Android plugin/DSL detected; AGP 9.x uses built-in Kotlin.' >&2
            exit 1
          fi

          require_grep 'com\.android\.application.*9\.4\.1' director-mode-android/build.gradle.kts 'AGP 9.4.1'
          require_grep 'kotlin-gradle-plugin:2\.4\.10' director-mode-android/build.gradle.kts 'KGP 2.4.10'
          require_grep 'compileSdk = 36' director-mode-android/app/build.gradle.kts 'compileSdk 36'
          require_grep 'targetSdk = 36' director-mode-android/app/build.gradle.kts 'targetSdk 36'
          require_grep 'minSdk = 24' director-mode-android/app/build.gradle.kts 'minSdk 24'
          require_grep 'camera-extensions' director-mode-android/app/build.gradle.kts 'CameraX Extensions dependency'
          require_grep 'tasks-vision:1\.1\.1' director-mode-android/app/build.gradle.kts 'MediaPipe Tasks Vision 1.1.1'
          require_grep 'litertlm-android:0\.18\.0' director-mode-android/app/build.gradle.kts 'LiteRT-LM 0.18.0'
          require_grep 'INITIAL_PLAN_DEADLINE_MS = 5_000L' director-mode-android/app/src/main/java/ai/auraforge/director/MainActivity.kt '5 second Director fallback deadline'
          require_grep 'BoundedPhotoReadinessEvaluator' director-mode-android/app/src/main/java/ai/auraforge/director/MainActivity.kt 'bounded READY evaluator wired into MainActivity'
          require_grep 'FallbackPhotoPlanner' director-mode-android/app/src/main/java/ai/auraforge/director/MainActivity.kt 'fallback planner wired into MainActivity'

          echo 'Committed Director V3 Android project passed source preflight.'

      - name: Pin and verify Android/Kotlin toolchain
        script: |
          set -euo pipefail
          java -version

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDK_ROOT="/usr/local/share/android-sdk"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"

          GRADLE_VERSION='9.6.0'
          GRADLE_ZIP="$CM_BUILD_DIR/.ci-gradle-${GRADLE_VERSION}.zip"
          GRADLE_HOME="$CM_BUILD_DIR/.ci-gradle/gradle-${GRADLE_VERSION}"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"
          rm -rf "$CM_BUILD_DIR/.ci-gradle"
          mkdir -p "$CM_BUILD_DIR/.ci-gradle"
          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR/.ci-gradle"
          test -x "$GRADLE_HOME/bin/gradle"
          "$GRADLE_HOME/bin/gradle" --version
          echo "GRADLE_BIN=$GRADLE_HOME/bin/gradle" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$CM_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$CM_ENV"

          cd "$CM_BUILD_DIR/director-mode-android"
          TOOLCHAIN_LOG="$CM_BUILD_DIR/director-mode-android/toolchain.log"
          "$GRADLE_HOME/bin/gradle" --no-daemon --console=plain buildEnvironment 2>&1 | tee "$TOOLCHAIN_LOG"
          if ! grep -q 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10' "$TOOLCHAIN_LOG"; then
            echo 'ERROR: Kotlin Gradle Plugin 2.4.10 was not resolved.' >&2
            exit 1
          fi

          DEPS_LOG="$CM_BUILD_DIR/director-mode-android/dependencies.log"
          "$GRADLE_HOME/bin/gradle" --no-daemon --console=plain :app:dependencyInsight \
            --dependency org.jetbrains.kotlin:kotlin-stdlib \
            --configuration debugCompileClasspath 2>&1 | tee "$DEPS_LOG"
          if ! grep -Eq 'kotlin-stdlib[^:]*:2\.4\.' "$DEPS_LOG"; then
            echo 'ERROR: debug compile classpath is not aligned to Kotlin stdlib 2.4.x.' >&2
            exit 1
          fi
          echo 'Android/Kotlin toolchain compatibility gate passed.'

      - name: Bundle offline AI models
        script: |
          set -euo pipefail
          ASSETS="$CM_BUILD_DIR/director-mode-android/app/src/main/assets"
          mkdir -p "$ASSETS"

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            -o "$ASSETS/pose_landmarker_lite.task"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            -o "$ASSETS/face_landmarker.task"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite' \
            -o "$ASSETS/efficientdet_lite0.tflite"

          VLM="$ASSETS/SmolVLM2-500M.litertlm"
          VLM_REVISION='aa352336f6929cf0fc576d573d7de9116e5a7faa'
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://huggingface.co/litert-community/SmolVLM2-500M/resolve/${VLM_REVISION}/SmolVLM2-500M.litertlm?download=true" \
            -o "$VLM"

          test -s "$ASSETS/pose_landmarker_lite.task"
          test -s "$ASSETS/face_landmarker.task"
          test -s "$ASSETS/efficientdet_lite0.tflite"
          test -s "$VLM"

          VLM_BYTES=$(stat -f%z "$VLM")
          if [ "$VLM_BYTES" -lt 300000000 ]; then
            echo "ERROR: bundled VLM is unexpectedly small ($VLM_BYTES bytes)." >&2
            exit 1
          fi

          EXPECTED_VLM_SHA='0dfb6fb881eb16e5ef2b2be04de5476caf939b7d9ae601fdee308bbc5462fd55'
          ACTUAL_VLM_SHA=$(shasum -a 256 "$VLM" | awk '{print $1}')
          if [ "$ACTUAL_VLM_SHA" != "$EXPECTED_VLM_SHA" ]; then
            echo "ERROR: SmolVLM2 model SHA mismatch." >&2
            echo "Expected: $EXPECTED_VLM_SHA" >&2
            echo "Actual:   $ACTUAL_VLM_SHA" >&2
            exit 1
          fi

          shasum -a 256 \
            "$ASSETS/pose_landmarker_lite.task" \
            "$ASSETS/face_landmarker.task" \
            "$ASSETS/efficientdet_lite0.tflite" \
            "$VLM" \
            | tee "$CM_BUILD_DIR/director-mode-android/MODEL_SHA256.txt"

      - name: Verify fully offline runtime contract
        script: |
          set -euo pipefail
          MANIFEST="$CM_BUILD_DIR/director-mode-android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo 'ERROR: Director runtime must not request INTERNET permission.' >&2
            exit 1
          fi
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          if grep -R --line-number -E 'https?://|Firebase|Retrofit|OkHttp' "$CM_BUILD_DIR/director-mode-android/app/src/main/java"; then
            echo 'ERROR: network-dependent runtime code was detected.' >&2
            exit 1
          fi
          echo 'Offline runtime contract passed.'

      - name: Compile installable APK
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/director-mode-android"
          LOG="$CM_BUILD_DIR/director-mode-android/compile.log"
          set +e
          "$GRADLE_BIN" --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo
            echo '========== KOTLIN/ANDROID COMPILER ERRORS =========='
            grep -E '(^e: |^w: |error: |Unresolved reference|Type mismatch|Cannot infer|Opt-in requirement|This API is experimental|Overload resolution ambiguity|No value passed for parameter|Too many arguments|Expecting |is not abstract and does not implement|overrides nothing|incompatible version of Kotlin|metadata version)' "$LOG" | tail -n 350 || true
            echo '===================================================='
            exit "$STATUS"
          fi
          test -s "$CM_BUILD_DIR/director-mode-android/app/build/outputs/apk/debug/app-debug.apk"
          echo 'Debug APK compilation passed.'

      - name: Run Android lint report
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/director-mode-android"
          LINT_LOG="$CM_BUILD_DIR/director-mode-android/lint.log"
          set +e
          "$GRADLE_BIN" --no-daemon --stacktrace --console=plain :app:lintDebug 2>&1 | tee "$LINT_LOG"
          LINT_STATUS=${PIPESTATUS[0]}
          set -e
          echo
          echo '================ LINT SUMMARY ================'
          grep -E '(^.+:[0-9]+: (Error|Warning):|^[0-9]+ errors?, [0-9]+ warnings?|Lint found)' "$LINT_LOG" | tail -n 250 || true
          echo '=============================================='
          if [ "$LINT_STATUS" -ne 0 ]; then
            echo 'Lint reported issues. Keeping them as diagnostics for the debug APK.'
          else
            echo 'Android lint completed successfully.'
          fi
          exit 0

      - name: Verify packaged APK
        script: |
          set -euo pipefail
          APK="$CM_BUILD_DIR/director-mode-android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$CM_BUILD_DIR/director-mode-android/Director-V3-autonomous-offline-debug.apk"
          APK_LIST="$CM_BUILD_DIR/director-mode-android/apk-contents.txt"

          test -s "$APK"
          unzip -Z1 "$APK" > "$APK_LIST"

          for required in \
            'assets/pose_landmarker_lite.task' \
            'assets/face_landmarker.task' \
            'assets/efficientdet_lite0.tflite' \
            'assets/SmolVLM2-500M.litertlm' \
            'assets/shot_templates.json' \
            'assets/director_config.json'; do
            if ! grep -Fxq "$required" "$APK_LIST"; then
              echo "ERROR: Required APK entry missing: $required" >&2
              grep -F "$(basename "$required")" "$APK_LIST" >&2 || true
              exit 1
            fi
          done

          cp "$APK" "$OUT"
          test -s "$OUT"
          shasum -a 256 "$OUT" | tee "$CM_BUILD_DIR/director-mode-android/APK_SHA256.txt"
          echo "Verified APK size: $(stat -f%z "$OUT") bytes"
          echo 'Director V3 APK package verification passed.'

    artifacts:
      - director-mode-android/Director-V3-autonomous-offline-debug.apk
      - director-mode-android/APK_SHA256.txt
      - director-mode-android/MODEL_SHA256.txt
      - director-mode-android/apk-contents.txt
      - director-mode-android/toolchain.log
      - director-mode-android/dependencies.log
      - director-mode-android/compile.log
      - director-mode-android/lint.log
      - director-mode-android/app/build/reports/**
