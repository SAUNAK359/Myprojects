workflows:
  director-android-debug-v4:
    name: Director Android Debug V4
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $HOME/.director/android-sdk
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: debug-v4"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current || true)"
          echo "Host: $(uname -a)"
          java -version

      - name: Bootstrap Android native toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x scripts/bootstrap_android_sdk.sh
          ./scripts/bootstrap_android_sdk.sh

      - name: Configure Director sources
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x gradlew scripts/*.sh scripts/*.py
          python3 scripts/compile_skills.py
          python3 -m json.tool app/src/main/assets/skills.json >/dev/null
          SDK_ROOT="$(cat "$CM_BUILD_DIR/.director-android-sdk-root")"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          echo "sdk.dir=$SDK_ROOT"
          mkdir -p "$CM_BUILD_DIR/director-build-logs"

      - name: Fetch pinned llama.cpp
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./scripts/fetch_llama_cpp.sh
          test -f third_party/llama.cpp/CMakeLists.txt

      - name: Compile debug APK
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/assemble-debug.log"
          set +e
          ./gradlew assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "========== DIRECTOR ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |^w: |C/C\+\+:|(^|[[:space:]])error:|Caused by:|Could not resolve|Execution failed for task|A problem occurred' "$LOG" | head -n 160 || true
            echo "========================================="
            exit "$STATUS"
          fi
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          echo "APK ready: $APK"

      - name: Unit tests
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/unit-tests.log"
          set +e
          ./gradlew testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "========== TEST ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |error:|Caused by:|Execution failed for task|FAILED' "$LOG" | head -n 160 || true
            echo "====================================="
            exit "$STATUS"
          fi

      - name: Android lint report
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/lint-debug.log"
          set +e
          ./gradlew lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e

          TXT="app/build/reports/lint-results-debug.txt"
          XML="app/build/reports/lint-results-debug.xml"
          HTML="app/build/reports/lint-results-debug.html"

          if [ -f "$TXT" ]; then
            echo "========== ANDROID LINT FINDINGS =========="
            cat "$TXT"
            echo "==========================================="
          elif [ -f "$XML" ]; then
            echo "Lint XML report produced at $XML"
          fi

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "DEBUG APK REMAINS PUBLISHABLE: lint found issues, but debug CI is diagnostic."
            echo "Release V4 remains strict and will not ship while lint errors exist."
            echo "========== LINT ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |error:|Caused by:|Execution failed for task|Fatal:' "$LOG" | head -n 160 || true
            echo "====================================="
          fi
          exit 0

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/reports/lint-results-*.html
      - Director/app/build/reports/lint-results-*.txt
      - Director/app/build/reports/lint-results-*.xml
      - Director/app/build/test-results/**/*.xml
      - director-build-logs/**/*.log

  director-android-release-v4:
    name: Director Android Release V4
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $HOME/.director/android-sdk
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: release-v4"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current || true)"
          java -version

      - name: Bootstrap Android native toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x scripts/bootstrap_android_sdk.sh
          ./scripts/bootstrap_android_sdk.sh

      - name: Configure Director sources
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x gradlew scripts/*.sh scripts/*.py
          python3 scripts/compile_skills.py
          python3 -m json.tool app/src/main/assets/skills.json >/dev/null
          SDK_ROOT="$(cat "$CM_BUILD_DIR/.director-android-sdk-root")"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          mkdir -p "$CM_BUILD_DIR/director-build-logs"

      - name: Fetch pinned llama.cpp
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./scripts/fetch_llama_cpp.sh
          test -f third_party/llama.cpp/CMakeLists.txt

      - name: Build and verify release
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/release.log"
          set +e
          ./gradlew assembleRelease bundleRelease testReleaseUnitTest lintRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER \
            --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            TXT="app/build/reports/lint-results-release.txt"
            if [ -f "$TXT" ]; then
              echo "========== RELEASE LINT FINDINGS =========="
              cat "$TXT"
              echo "==========================================="
            fi
            echo "========== RELEASE ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |C/C\+\+:|error:|Caused by:|Could not resolve|Execution failed for task|A problem occurred|Fatal:' "$LOG" | head -n 200 || true
            echo "========================================"
            exit "$STATUS"
          fi

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/outputs/**/*.aab
      - Director/app/build/reports/lint-results-*.html
      - Director/app/build/reports/lint-results-*.txt
      - Director/app/build/reports/lint-results-*.xml
      - director-build-logs/**/*.log
