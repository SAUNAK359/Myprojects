workflows:
  director-android-debug-v6:
    name: Director Android Debug V6
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $HOME/.director/android-sdk
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: debug-v6"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current || true)"
          echo "Host: $(uname -a)"
          java -version

      - name: Bootstrap Android native toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x scripts/*.sh scripts/*.py gradlew
          ./scripts/bootstrap_android_sdk.sh

      - name: Validate product contract and sources
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          python3 scripts/compile_skills.py
          python3 -m json.tool app/src/main/assets/skills.json >/dev/null
          python3 scripts/validate_product_contract.py
          SDK_ROOT="$(cat "$CM_BUILD_DIR/.director-android-sdk-root")"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          echo "sdk.dir=$SDK_ROOT"
          test -s "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"
          test -s "$SDK_ROOT/ndk/28.2.13676358/source.properties"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          mkdir -p "$CM_BUILD_DIR/director-build-logs"

      - name: Fetch pinned llama.cpp
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./scripts/fetch_llama_cpp.sh
          test -f third_party/llama.cpp/CMakeLists.txt

      - name: Compile debug APK
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/assemble-debug.log"
          set +e
          ./gradlew assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "========== DIRECTOR ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |^w: |C/C\+\+:|(^|[[:space:]])error:|Caused by:|Could not resolve|Execution failed for task|A problem occurred' "$LOG" | head -n 240 || true
            echo "========================================="
            exit "$STATUS"
          fi
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "APK ready: $APK"

      - name: Unit tests
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/unit-tests.log"
          set +e
          ./gradlew testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "========== TEST ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |error:|Caused by:|Execution failed for task|FAILED' "$LOG" | head -n 240 || true
            echo "====================================="
            exit "$STATUS"
          fi

      - name: Android lint report
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/lint-debug.log"
          set +e
          ./gradlew lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e
          TXT="app/build/reports/lint-results-debug.txt"
          if [ -f "$TXT" ]; then
            echo "========== ANDROID LINT FINDINGS =========="
            cat "$TXT"
            echo "==========================================="
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "DEBUG APK remains publishable for device validation; Release V6 remains strict."
            grep -nE '^\* What went wrong:|^e: |error:|Caused by:|Execution failed for task|Fatal:' "$LOG" | head -n 240 || true
          fi
          exit 0

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/reports/lint-results-*.html
      - Director/app/build/reports/lint-results-*.txt
      - Director/app/build/reports/lint-results-*.xml
      - Director/app/build/test-results/**/*.xml
      - director-build-logs/**/*.log

  director-android-release-v6:
    name: Director Android Release V6
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $HOME/.director/android-sdk
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: release-v6"
          echo "Commit: $(git rev-parse HEAD)"
          java -version

      - name: Bootstrap and validate
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x scripts/*.sh scripts/*.py gradlew
          ./scripts/bootstrap_android_sdk.sh
          python3 scripts/compile_skills.py
          python3 -m json.tool app/src/main/assets/skills.json >/dev/null
          python3 scripts/validate_product_contract.py
          SDK_ROOT="$(cat "$CM_BUILD_DIR/.director-android-sdk-root")"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          test -s "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"
          test -s "$SDK_ROOT/ndk/28.2.13676358/source.properties"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          mkdir -p "$CM_BUILD_DIR/director-build-logs"
          ./scripts/fetch_llama_cpp.sh
          test -f third_party/llama.cpp/CMakeLists.txt

      - name: Build and verify release
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/Director"
          LOG="$CM_BUILD_DIR/director-build-logs/release.log"
          set +e
          ./gradlew assembleRelease bundleRelease testReleaseUnitTest lintRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER \
            --stacktrace --console=plain --no-daemon 2>&1 | tee "$LOG"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            TXT="app/build/reports/lint-results-release.txt"
            if [ -f "$TXT" ]; then cat "$TXT"; fi
            echo "========== RELEASE ROOT CAUSE =========="
            grep -nE '^\* What went wrong:|^e: |C/C\+\+:|error:|Caused by:|Could not resolve|Execution failed for task|A problem occurred|Fatal:' "$LOG" | head -n 280 || true
            echo "========================================"
            exit "$STATUS"
          fi
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          echo "Release APK: $APK"
          echo "Release AAB: $AAB"

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/outputs/**/*.aab
      - Director/app/build/reports/lint-results-*.html
      - Director/app/build/reports/lint-results-*.txt
      - Director/app/build/reports/lint-results-*.xml
      - director-build-logs/**/*.log
