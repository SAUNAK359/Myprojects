workflows:
  director-android-debug:
    name: Director Android Debug
    working_directory: Director
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director.debug"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
    scripts:
      - name: Environment
        script: |
          set -euo pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          java -version
          ./gradlew --version
      - name: Unit tests
        script: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        script: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
      - name: Lint report (debug diagnostic)
        script: |
          set -uo pipefail
          set +e
          ./gradlew --no-daemon lintDebug
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Debug APK remains publishable; lint findings are retained as artifacts."
            echo "Release workflow remains strict and will fail on lint errors."
          fi
          exit 0
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/reports/lint-results-*.html
      - app/build/reports/lint-results-*.txt
      - app/build/reports/lint-results-*.xml
      - app/build/test-results/**/*.xml

  director-android-release:
    name: Director Android Release
    working_directory: Director
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
    scripts:
      - name: Environment
        script: |
          set -euo pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          java -version
          ./gradlew --version
      - name: Validate release
        script: |
          set -euo pipefail
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"
          echo "Release APK: $APK"
          echo "Release AAB: $AAB"
          ls -lh "$APK" "$AAB"
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/reports/lint-results-*.html
      - app/build/reports/lint-results-*.txt
      - app/build/reports/lint-results-*.xml
      - app/build/test-results/**/*.xml
