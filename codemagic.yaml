workflows:
  director-android-debug-v2:
    name: Director Android Debug V2
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $HOME/.director/android-sdk
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: debug-v2"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current || true)"
          echo "Host: $(uname -a)"
          java -version

      - name: Bootstrap Android native toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x scripts/bootstrap_android_sdk.sh
          ./scripts/bootstrap_android_sdk.sh

      - name: Configure Director sources
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x gradlew scripts/*.sh scripts/*.py
          python3 scripts/compile_skills.py
          python3 -m json.tool app/src/main/assets/skills.json >/dev/null
          SDK_ROOT="$(cat "$CM_BUILD_DIR/.director-android-sdk-root")"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
          echo "sdk.dir=$SDK_ROOT"

      - name: Fetch pinned llama.cpp
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./scripts/fetch_llama_cpp.sh
          test -f third_party/llama.cpp/CMakeLists.txt

      - name: Unit tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./gradlew assembleDebug --stacktrace --no-daemon
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/reports/lint-results-*.html
      - Director/app/build/test-results/**/*.xml

  director-android-release-v2:
    name: Director Android Release V2
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.saunak.director"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/director-wrapper
        - $CM_BUILD_DIR/Director/third_party/llama.cpp
        - $HOME/.director/android-sdk
    scripts:
      - name: Build identity
        script: |
          set -euo pipefail
          echo "Director Codemagic workflow: release-v2"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current || true)"
          java -version

      - name: Bootstrap Android native toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x scripts/bootstrap_android_sdk.sh
          ./scripts/bootstrap_android_sdk.sh

      - name: Configure Director sources
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          chmod +x gradlew scripts/*.sh scripts/*.py
          python3 scripts/compile_skills.py
          python3 -m json.tool app/src/main/assets/skills.json >/dev/null
          SDK_ROOT="$(cat "$CM_BUILD_DIR/.director-android-sdk-root")"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties

      - name: Fetch pinned llama.cpp
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./scripts/fetch_llama_cpp.sh
          test -f third_party/llama.cpp/CMakeLists.txt

      - name: Test and lint release
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./gradlew testReleaseUnitTest lintRelease --stacktrace --no-daemon

      - name: Build release artifacts
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/Director"
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=$BUILD_NUMBER \
            -PversionName=1.0.$BUILD_NUMBER \
            --stacktrace --no-daemon

    artifacts:
      - Director/app/build/outputs/**/*.apk
      - Director/app/build/outputs/**/*.aab
      - Director/app/build/reports/lint-results-*.html
