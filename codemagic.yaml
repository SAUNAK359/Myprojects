workflows:
  director-mode-android:
    name: Director Mode 2 Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Verify committed Android source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f director-mode-android/settings.gradle.kts
          test -f director-mode-android/build.gradle.kts
          test -f director-mode-android/app/build.gradle.kts
          test -f director-mode-android/app/src/main/AndroidManifest.xml
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/MainActivity.kt
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/camera/CameraEngine.kt
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/ml/VisionPipeline.kt
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/body/BodyModel.kt
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/director/DirectorBrain.kt
          test -f director-mode-android/app/src/main/assets/shot_templates.json
          test -f director-mode-android/app/src/main/assets/director_config.json
          test -f director-mode-android/app/src/main/res/layout/activity_main.xml

          if grep -R --line-number 'org.jetbrains.kotlin.android\|kotlinOptions' director-mode-android/*.gradle.kts director-mode-android/app/*.gradle.kts; then
            echo 'ERROR: legacy Kotlin Gradle configuration detected; AGP 9.4 uses built-in Kotlin.' >&2
            exit 1
          fi
          grep -q 'com.android.application.*9.4.0' director-mode-android/build.gradle.kts
          grep -q 'compileSdk = 36' director-mode-android/app/build.gradle.kts
          grep -q 'targetSdk = 36' director-mode-android/app/build.gradle.kts
          grep -q 'minSdk = 24' director-mode-android/app/build.gradle.kts
          grep -q 'tasks-vision:1.1.1' director-mode-android/app/build.gradle.kts
          grep -q 'litertlm-android:0.18.0' director-mode-android/app/build.gradle.kts
          echo 'Committed Director 2 Android project passed source preflight.'

      - name: Pin stable Android toolchain
        script: |
          set -euo pipefail
          java -version

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDK_ROOT="/usr/local/share/android-sdk"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"

          GRADLE_VERSION='9.6.0'
          GRADLE_ZIP="$CM_BUILD_DIR/.ci-gradle-${GRADLE_VERSION}.zip"
          GRADLE_HOME="$CM_BUILD_DIR/.ci-gradle/gradle-${GRADLE_VERSION}"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"
          rm -rf "$CM_BUILD_DIR/.ci-gradle"
          mkdir -p "$CM_BUILD_DIR/.ci-gradle"
          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR/.ci-gradle"
          test -x "$GRADLE_HOME/bin/gradle"
          "$GRADLE_HOME/bin/gradle" --version
          echo "GRADLE_BIN=$GRADLE_HOME/bin/gradle" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$CM_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$CM_ENV"

      - name: Bundle offline AI models
        script: |
          set -euo pipefail
          ASSETS="$CM_BUILD_DIR/director-mode-android/app/src/main/assets"
          mkdir -p "$ASSETS"

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            -o "$ASSETS/pose_landmarker_lite.task"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            -o "$ASSETS/face_landmarker.task"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite' \
            -o "$ASSETS/efficientdet_lite0.tflite"

          VLM="$ASSETS/SmolVLM2-500M.litertlm"
          curl --fail --location --retry 5 --retry-delay 3 \
            'https://huggingface.co/litert-community/SmolVLM2-500M/resolve/main/SmolVLM2-500M.litertlm?download=true' \
            -o "$VLM"

          test -s "$ASSETS/pose_landmarker_lite.task"
          test -s "$ASSETS/face_landmarker.task"
          test -s "$ASSETS/efficientdet_lite0.tflite"
          test -s "$VLM"

          VLM_BYTES=$(stat -f%z "$VLM")
          if [ "$VLM_BYTES" -lt 300000000 ]; then
            echo "ERROR: bundled VLM is unexpectedly small ($VLM_BYTES bytes)." >&2
            exit 1
          fi

          EXPECTED_VLM_SHA='b808b328d845a600a33c5295f93d9217487317bd334dbc91b2a8d50e26e60ad0'
          ACTUAL_VLM_SHA=$(shasum -a 256 "$VLM" | awk '{print $1}')
          if [ "$ACTUAL_VLM_SHA" != "$EXPECTED_VLM_SHA" ]; then
            echo "ERROR: SmolVLM2 model SHA mismatch." >&2
            echo "Expected: $EXPECTED_VLM_SHA" >&2
            echo "Actual:   $ACTUAL_VLM_SHA" >&2
            exit 1
          fi

          shasum -a 256 \
            "$ASSETS/pose_landmarker_lite.task" \
            "$ASSETS/face_landmarker.task" \
            "$ASSETS/efficientdet_lite0.tflite" \
            "$VLM" \
            | tee "$CM_BUILD_DIR/director-mode-android/MODEL_SHA256.txt"

      - name: Verify fully offline runtime contract
        script: |
          set -euo pipefail
          MANIFEST="$CM_BUILD_DIR/director-mode-android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo 'ERROR: Director Mode runtime must not request INTERNET permission.' >&2
            exit 1
          fi
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          if grep -R --line-number -E 'https?://|Firebase|Retrofit|OkHttp' "$CM_BUILD_DIR/director-mode-android/app/src/main/java"; then
            echo 'ERROR: network-dependent runtime code was detected.' >&2
            exit 1
          fi
          echo 'Offline runtime contract passed.'

      - name: Compile installable APK
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/director-mode-android"
          LOG="$CM_BUILD_DIR/director-mode-android/compile.log"
          set +e
          "$GRADLE_BIN" --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo
            echo '========== KOTLIN/ANDROID COMPILER ERRORS =========='
            grep -E '(^e: |^w: |error: |Unresolved reference|Type mismatch|Cannot infer|Opt-in requirement|This API is experimental|Overload resolution ambiguity|No value passed for parameter|Too many arguments|Expecting |is not abstract and does not implement|overrides nothing)' "$LOG" | tail -n 300 || true
            echo '===================================================='
            exit "$STATUS"
          fi

      - name: Run Android lint report
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/director-mode-android"
          LINT_LOG="$CM_BUILD_DIR/director-mode-android/lint.log"
          set +e
          "$GRADLE_BIN" --no-daemon --stacktrace --console=plain :app:lintDebug 2>&1 | tee "$LINT_LOG"
          LINT_STATUS=${PIPESTATUS[0]}
          set -e
          echo
          echo '================ LINT SUMMARY ================'
          grep -E '(^.+:[0-9]+: (Error|Warning):|^[0-9]+ errors?, [0-9]+ warnings?|Lint found)' "$LINT_LOG" | tail -n 250 || true
          echo '=============================================='
          if [ "$LINT_STATUS" -ne 0 ]; then
            echo 'Lint reported issues. Keeping them as diagnostics for the debug APK; APK verification will still run.'
          else
            echo 'Android lint completed successfully.'
          fi
          exit 0

      - name: Verify packaged APK
        script: |
          set -euo pipefail
          APK="$CM_BUILD_DIR/director-mode-android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$CM_BUILD_DIR/director-mode-android/DirectorMode-v2-offline-debug.apk"
          APK_LIST="$CM_BUILD_DIR/director-mode-android/apk-contents.txt"

          test -s "$APK"
          unzip -Z1 "$APK" > "$APK_LIST"

          for required in \
            'assets/pose_landmarker_lite.task' \
            'assets/face_landmarker.task' \
            'assets/efficientdet_lite0.tflite' \
            'assets/SmolVLM2-500M.litertlm' \
            'assets/shot_templates.json' \
            'assets/director_config.json'; do
            if ! grep -Fxq "$required" "$APK_LIST"; then
              echo "ERROR: Required APK entry missing: $required" >&2
              echo 'Matching APK entries:' >&2
              grep -F "$(basename "$required")" "$APK_LIST" >&2 || true
              exit 1
            fi
          done

          cp "$APK" "$OUT"
          test -s "$OUT"
          shasum -a 256 "$OUT" | tee "$CM_BUILD_DIR/director-mode-android/APK_SHA256.txt"
          echo "Verified APK size: $(stat -f%z "$OUT") bytes"
          echo 'Director 2 APK package verification passed.'

    artifacts:
      - director-mode-android/DirectorMode-v2-offline-debug.apk
      - director-mode-android/APK_SHA256.txt
      - director-mode-android/MODEL_SHA256.txt
      - director-mode-android/apk-contents.txt
      - director-mode-android/compile.log
      - director-mode-android/lint.log
      - director-mode-android/app/build/reports/**
