workflows:
  director-mode-android:
    name: Director Mode Offline Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Verify committed Android source
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f director-mode-android/settings.gradle.kts
          test -f director-mode-android/build.gradle.kts
          test -f director-mode-android/app/build.gradle.kts
          test -f director-mode-android/app/src/main/AndroidManifest.xml
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/MainActivity.kt
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/camera/CameraEngine.kt
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/ml/VisionPipeline.kt
          test -f director-mode-android/app/src/main/java/ai/auraforge/director/director/DirectorBrain.kt
          test -f director-mode-android/app/src/main/assets/shot_templates.json
          test -f director-mode-android/app/src/main/assets/director_config.json
          test -f director-mode-android/app/src/main/res/layout/activity_main.xml

          if grep -R --line-number 'org.jetbrains.kotlin.android\|kotlinOptions' director-mode-android/*.gradle.kts director-mode-android/app/*.gradle.kts; then
            echo 'ERROR: legacy Kotlin Gradle configuration detected; AGP 9.4 uses built-in Kotlin.' >&2
            exit 1
          fi
          grep -q 'com.android.application.*9.4.0' director-mode-android/build.gradle.kts
          grep -q 'compileSdk = 37' director-mode-android/app/build.gradle.kts
          grep -q 'targetSdk = 37' director-mode-android/app/build.gradle.kts
          grep -q 'minSdk = 24' director-mode-android/app/build.gradle.kts
          grep -q 'tasks-vision:1.1.1' director-mode-android/app/build.gradle.kts
          echo 'Committed Android project passed source preflight.'

      - name: Pin official AGP 9.4 Android toolchain
        script: |
          set -euo pipefail
          java -version

          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDK_ROOT="/usr/local/share/android-sdk"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0'

          GRADLE_VERSION='9.6.0'
          GRADLE_ZIP="$CM_BUILD_DIR/.ci-gradle-${GRADLE_VERSION}.zip"
          GRADLE_HOME="$CM_BUILD_DIR/.ci-gradle/gradle-${GRADLE_VERSION}"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"
          rm -rf "$CM_BUILD_DIR/.ci-gradle"
          mkdir -p "$CM_BUILD_DIR/.ci-gradle"
          unzip -q "$GRADLE_ZIP" -d "$CM_BUILD_DIR/.ci-gradle"
          test -x "$GRADLE_HOME/bin/gradle"
          "$GRADLE_HOME/bin/gradle" --version
          echo "GRADLE_BIN=$GRADLE_HOME/bin/gradle" >> "$CM_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$CM_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$CM_ENV"

      - name: Bundle official offline vision models
        script: |
          set -euo pipefail
          ASSETS="$CM_BUILD_DIR/director-mode-android/app/src/main/assets"
          mkdir -p "$ASSETS"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' \
            -o "$ASSETS/pose_landmarker_lite.task"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            -o "$ASSETS/face_landmarker.task"
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite' \
            -o "$ASSETS/efficientdet_lite0.tflite"
          test -s "$ASSETS/pose_landmarker_lite.task"
          test -s "$ASSETS/face_landmarker.task"
          test -s "$ASSETS/efficientdet_lite0.tflite"
          shasum -a 256 "$ASSETS/pose_landmarker_lite.task" "$ASSETS/face_landmarker.task" "$ASSETS/efficientdet_lite0.tflite" \
            | tee "$CM_BUILD_DIR/director-mode-android/MODEL_SHA256.txt"

      - name: Verify fully offline runtime contract
        script: |
          set -euo pipefail
          MANIFEST="$CM_BUILD_DIR/director-mode-android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo 'ERROR: Director Mode runtime must not request INTERNET permission.' >&2
            exit 1
          fi
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          if grep -R --line-number -E 'https?://|Firebase|Retrofit|OkHttp' "$CM_BUILD_DIR/director-mode-android/app/src/main/java"; then
            echo 'ERROR: network-dependent runtime code was detected.' >&2
            exit 1
          fi
          echo 'Offline runtime contract passed.'

      - name: Compile installable APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/director-mode-android"
          "$GRADLE_BIN" --no-daemon --stacktrace :app:assembleDebug

      - name: Run Android lint gate
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/director-mode-android"
          "$GRADLE_BIN" --no-daemon --stacktrace :app:lintDebug

      - name: Verify packaged APK
        script: |
          set -euo pipefail
          APK="$CM_BUILD_DIR/director-mode-android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$CM_BUILD_DIR/director-mode-android/DirectorMode-v1-offline-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/pose_landmarker_lite.task'
          unzip -l "$APK" | grep -q 'assets/face_landmarker.task'
          unzip -l "$APK" | grep -q 'assets/efficientdet_lite0.tflite'
          unzip -l "$APK" | grep -q 'assets/shot_templates.json'
          unzip -l "$APK" | grep -q 'assets/director_config.json'
          cp "$APK" "$OUT"
          shasum -a 256 "$OUT" | tee "$CM_BUILD_DIR/director-mode-android/APK_SHA256.txt"
          echo 'APK package verification passed.'

    artifacts:
      - director-mode-android/DirectorMode-v1-offline-debug.apk
      - director-mode-android/APK_SHA256.txt
      - director-mode-android/MODEL_SHA256.txt
      - director-mode-android/app/build/reports/**
