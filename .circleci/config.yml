version: 2.1

commands:
  prepare-android:
    steps:
      - checkout
      - restore_cache:
          keys:
            - director-gradle-v8-{{ checksum "Director/gradle.properties" }}
            - director-gradle-v8-
      - run:
          name: Prepare Android toolchain
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-17-jdk-headless unzip zip procps
            JAVA17_HOME="$(dirname "$(dirname "$(readlink -f "$(update-alternatives --list java | grep 'java-17' | head -n 1)")")")"
            echo "export JAVA_HOME=$JAVA17_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
            cd Director
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
            chmod +x gradlew

jobs:
  assemble-probe:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium+
    working_directory: ~/project
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
      TERM: dumb
    steps:
      - prepare-android
      - run:
          name: Assemble debug APK
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director
            ./gradlew --no-daemon --no-parallel --stacktrace --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process assembleDebug
            APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
            test -n "$APK" && test -s "$APK"

  lint-probe:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium+
    working_directory: ~/project
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
      TERM: dumb
    steps:
      - prepare-android
      - run:
          name: Lint debug
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director
            ./gradlew --no-daemon --no-parallel --stacktrace --max-workers=1 \
              -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process lintDebug

  apk-verify-probe:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium+
    working_directory: ~/project
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
      TERM: dumb
    steps:
      - prepare-android
      - run:
          name: Assemble and verify APK container
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director
            ./gradlew --no-daemon --no-parallel --stacktrace --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process assembleDebug
            APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
            test -n "$APK" && test -s "$APK"
            BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" >/dev/null
            "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
            unzip -t "$APK" >/dev/null
            unzip -l "$APK" > /tmp/apk-files.txt
            grep -qE '(^|[[:space:]])classes\.dex$' /tmp/apk-files.txt

workflows:
  apk-diagnose:
    jobs:
      - assemble-probe:
          filters: &only_diag
            branches:
              only: director-sierra-v4-apk-diagnose
      - lint-probe:
          filters: *only_diag
      - apk-verify-probe:
          filters: *only_diag
