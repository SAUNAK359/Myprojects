version: 2.1

jobs:
  lint-probe:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium+
    working_directory: ~/project
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
      TERM: dumb
    steps:
      - checkout
      - restore_cache:
          keys:
            - director-gradle-v8-{{ checksum "Director/gradle.properties" }}
            - director-gradle-v8-
      - run:
          name: Prepare Android build
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-17-jdk-headless
            JAVA17_HOME="$(dirname "$(dirname "$(readlink -f "$(update-alternatives --list java | grep 'java-17' | head -n 1)")")")"
            echo "export JAVA_HOME=$JAVA17_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
            cd Director
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
            chmod +x gradlew
      - run:
          name: Classify camera and engine lint errors
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director
            set +e
            ./gradlew --no-daemon --no-parallel --max-workers=1 \
              -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process lintDebug >/tmp/lint-gradle.log 2>&1
            set -e
            REPORT="$(find app/build/reports -type f -name 'lint-results-debug.xml' -print -quit)"
            test -n "$REPORT" && test -s "$REPORT"
            python3 - "$REPORT" <<'PY'
            import sys, xml.etree.ElementTree as ET
            report=sys.argv[1]
            found=False
            for issue in ET.parse(report).getroot().findall('issue'):
                if issue.get('severity') != 'Error':
                    continue
                for loc in issue.findall('location'):
                    f=loc.get('file','')
                    if '/camera/' in f or '/engine/' in f:
                        found=True
            sys.exit(1 if found else 0)
            PY

workflows:
  v4-lint-probe:
    jobs:
      - lint-probe:
          filters:
            branches:
              only:
                - director-sierra-v4-apk-diagnose
