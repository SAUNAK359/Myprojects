version: 2.1

executors:
  android:
    docker:
      - image: cimg/android:2026.01
    resource_class: medium
    working_directory: ~/project

defaults: &defaults
  executor: android
  environment:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process"
  steps:
    - checkout
    - run:
        name: Configure Android SDK
        command: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Director/local.properties
    - restore_cache:
        keys:
          - director-gradle-v5-{{ checksum "Director/gradle/libs.versions.toml" }}-{{ checksum "Director/app/build.gradle.kts" }}
          - director-gradle-v5-
    - run:
        name: Compile Director
        command: |
          cd Director
          chmod +x gradlew
          ./gradlew --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
            -Pkotlin.compiler.execution.strategy=in-process compileDebugKotlin
    - save_cache:
        key: director-gradle-v5-{{ checksum "Director/gradle/libs.versions.toml" }}-{{ checksum "Director/app/build.gradle.kts" }}
        paths:
          - ~/.gradle/caches
          - ~/.gradle/wrapper

jobs:
  director-provider-boundary:
    docker:
      - image: cimg/base:2026.01
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Validate provider boundary
          command: |
            set -euo pipefail
            python3 - <<'PY'
            from pathlib import Path
            root = Path("Director/app/src/main")
            offenders = []
            for path in root.rglob("*.kt"):
                text = path.read_text(errors="ignore")
                for needle in ("openai.com", "anthropic.com", "generativelanguage.googleapis.com"):
                    if needle in text:
                        offenders.append(f"{path}: {needle}")
            if offenders:
                print("Direct provider endpoints found:")
                print("\n".join(offenders))
                raise SystemExit(1)
            print("Provider boundary OK")
            PY

  director-compile-no-ui:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Compile without UI dependency assumptions
          command: |
            cd Director
            chmod +x gradlew
            ./gradlew --no-daemon --no-parallel --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process compileDebugKotlin

  director-compile-no-runtime:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Compile runtime-isolated variant
          command: |
            cd Director
            chmod +x gradlew
            ./gradlew --no-daemon --no-parallel --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process compileDebugKotlin

  director-compile-no-backend:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Compile backend-isolated variant
          command: |
            cd Director
            chmod +x gradlew
            ./gradlew --no-daemon --no-parallel --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process compileDebugKotlin

  director-compile:
    <<: *defaults

  director-unit-tests:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Configure Android SDK
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Director/local.properties
      - run:
          name: Run unit tests
          command: |
            cd Director
            chmod +x gradlew
            ./gradlew --no-daemon --no-parallel --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest
      - store_test_results:
          path: Director/app/build/test-results
      - store_artifacts:
          path: Director/app/build/reports/tests
          destination: unit-test-reports

  build-director-apk:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Configure Android SDK
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Director/local.properties
      - restore_cache:
          keys:
            - director-gradle-v5-{{ checksum "Director/gradle/libs.versions.toml" }}-{{ checksum "Director/app/build.gradle.kts" }}
            - director-gradle-v5-
      - run:
          name: Unit tests, lint and build APK
          command: |
            cd Director
            chmod +x gradlew
            ./gradlew --no-daemon --no-parallel --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process testDebugUnitTest lintDebug assembleDebug
      - run:
          name: Verify APK integrity
          command: |
            set -euo pipefail
            APK="Director/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" >/tmp/director-badging.txt
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
            sha256sum "$APK"
      - store_artifacts:
          path: Director/app/build/outputs/apk/debug/app-debug.apk
          destination: director-debug.apk
      - store_artifacts:
          path: Director/app/build/reports
          destination: build-reports

  director-lint:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Configure Android SDK
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Director/local.properties
      - run:
          name: Strict Android lint
          command: |
            cd Director
            chmod +x gradlew
            ./gradlew --no-daemon --no-parallel --max-workers=2 \
              -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' \
              -Pkotlin.compiler.execution.strategy=in-process lintDebug
      - store_artifacts:
          path: Director/app/build/reports
          destination: lint-reports

workflows:
  director-build:
    jobs:
      - director-provider-boundary:
          filters: &director_filter
            branches:
              only:
                - director-gemini-v1
                - director-sierra-v3
                - director-sierra-v4-camera-os
                - director-sierra-v5-temporal-scene
                - director-sierra-v6-subject-intelligence
                - director-sierra-v7-prif
                - director-sierra-v8-anip
      - director-compile-no-ui:
          filters: *director_filter
      - director-compile-no-runtime:
          filters: *director_filter
      - director-compile-no-backend:
          filters: *director_filter
      - director-compile:
          filters: *director_filter
      - director-unit-tests:
          filters: *director_filter
      - build-director-apk:
          filters: *director_filter
      - director-lint:
          filters: *director_filter
