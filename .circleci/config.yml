version: 2.1

jobs:
  sierra-import:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Sierra server
          command: |
            set -euo pipefail
            cd SierraServer
            python -m pip install --upgrade pip
            pip install '.[dev]'
      - run:
          name: Compile and import
          command: |
            set -euo pipefail
            cd SierraServer
            python -m compileall -q app tests scripts
            python -c 'import app.main; import app.provider_client; import app.job_worker; print("Sierra import OK")'

  sierra-static:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Sierra server
          command: |
            set -euo pipefail
            cd SierraServer
            python -m pip install --upgrade pip
            pip install '.[dev]'
      - run:
          name: Static correctness
          command: |
            set -euo pipefail
            cd SierraServer
            ruff check app tests scripts

  sierra-tests:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Sierra server
          command: |
            set -euo pipefail
            cd SierraServer
            python -m pip install --upgrade pip
            pip install '.[dev]'
      - run:
          name: Unit tests
          command: |
            set -euo pipefail
            cd SierraServer
            mkdir -p /tmp/sierra-test-results
            pytest -q --junitxml=/tmp/sierra-test-results/results.xml
      - store_test_results:
          path: /tmp/sierra-test-results

workflows:
  sierra-server-build:
    jobs:
      - sierra-import:
          filters: &server_filter
            branches:
              only:
                - sierra-vision-server-v1
      - sierra-static:
          filters: *server_filter
      - sierra-tests:
          filters: *server_filter
