  lint-other:
    docker: [{image: cimg/android:2026.08}]
    resource_class: medium+
    working_directory: ~/project
    steps:
      - prepare-android
      - generate-lint
      - run:
          name: Detect other source errors
          command: |
            python3 - <<'PY'
            import sys,xml.etree.ElementTree as ET
            known=('AndroidManifest.xml','/res/','/camera/','/engine/','/ui/','/director/','/backend/','/ai/')
            bad=[]
            for i in ET.parse('/tmp/lint.xml').getroot().findall('issue'):
              if i.get('severity')!='Error': continue
              fs=[x.get('file','') for x in i.findall('location')]
              if not fs or any(not any(k in f for k in known) for f in fs): bad.append(i.get('id'))
            sys.exit(bool(bad))
            PY

workflows:
  lint-classify:
    jobs:
      - lint-manifest-res:
          filters: &diag_filter
            branches:
              only: director-sierra-v4-apk-diagnose
      - lint-camera:
          filters: *diag_filter
      - lint-engine:
          filters: *diag_filter
      - lint-ui-director:
          filters: *diag_filter
      - lint-backend-ai:
          filters: *diag_filter
      - lint-other:
          filters: *diag_filter
