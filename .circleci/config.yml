version: 2.1

jobs:
  test-sierra-server:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    working_directory: ~/project
    environment:
      SIERRA_JWT_SECRET: 0123456789012345678901234567890123456789
      SIERRA_PROVIDER_MASTER_KEY: j9fYzPzGZRXnZN4oWg_2-ZE6fAKh4CrJz8X3rOMbTgI=

    steps:
      - checkout

      - restore_cache:
          keys:
            - sierra-server-pip-v2-{{ checksum "SierraServer/pyproject.toml" }}
            - sierra-server-pip-v2-

      - run:
          name: Install Sierra server
          command: |
            set -euo pipefail
            cd SierraServer
            python -m pip install --upgrade pip
            pip install '.[dev]'

      - run:
          name: Import and static validation
          command: |
            set -euo pipefail
            cd SierraServer
            python -m compileall -q app tests scripts
            python -c 'import app.main; import app.provider_client; import app.job_worker'
            ruff check app tests scripts

      - run:
          name: Unit tests
          command: |
            set -euo pipefail
            cd SierraServer
            mkdir -p /tmp/sierra-test-results
            pytest -q --junitxml=/tmp/sierra-test-results/results.xml

      - save_cache:
          key: sierra-server-pip-v2-{{ checksum "SierraServer/pyproject.toml" }}
          paths:
            - ~/.cache/pip

      - store_test_results:
          path: /tmp/sierra-test-results

workflows:
  sierra-server-build:
    jobs:
      - test-sierra-server:
          filters:
            branches:
              only:
                - sierra-vision-server-v1
