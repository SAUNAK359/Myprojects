version: 2.1

commands:
  prepare-android:
    steps:
      - checkout
      - restore_cache:
          keys:
            - director-gradle-v8-{{ checksum "Director/gradle.properties" }}
            - director-gradle-v8-
      - run:
          name: Prepare Android toolchain
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-17-jdk-headless
            JAVA17_HOME="$(dirname "$(dirname "$(readlink -f "$(update-alternatives --list java | grep 'java-17' | head -n 1)")")")"
            echo "export JAVA_HOME=$JAVA17_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
            cd Director
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
            chmod +x gradlew

  generate-lint:
    steps:
      - run:
          name: Generate lint report
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director
            set +e
            ./gradlew --no-daemon --no-parallel --max-workers=1 \
              -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process lintDebug >/tmp/lint-gradle.log 2>&1
            set -e
            REPORT="$(find app/build/reports -type f -name 'lint-results-debug.xml' -print -quit)"
            test -n "$REPORT" && test -s "$REPORT"
            cp "$REPORT" /tmp/lint.xml

jobs:
  lint-manifest-res:
    docker: [{image: cimg/android:2026.08}]
    resource_class: medium+
    working_directory: ~/project
    steps:
      - prepare-android
      - generate-lint
      - run:
          name: Detect manifest or resource errors
          command: |
            python3 - <<'PY'
            import sys,xml.etree.ElementTree as ET
            bad=[]
            for i in ET.parse('/tmp/lint.xml').getroot().findall('issue'):
              if i.get('severity')!='Error': continue
              fs=[x.get('file','') for x in i.findall('location')]
              if any('AndroidManifest.xml' in f or '/res/' in f for f in fs): bad.append(i.get('id'))
            sys.exit(bool(bad))
            PY
