version: 2.1

jobs:
  build-director-apk:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project
    environment:
      GRADLE_USER_HOME: /home/circleci/.gradle
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - director-gradle-v4-{{ checksum "Director/gradle.properties" }}
            - director-gradle-v4-

      - run:
          name: Prepare Java 17, Android SDK 36 and CI memory profile
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-17-jdk-headless unzip zip

            JAVA17_HOME="$(dirname "$(dirname "$(readlink -f "$(update-alternatives --list java | grep 'java-17' | head -n 1)")")")"
            echo "export JAVA_HOME=$JAVA17_HOME" >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"

            mkdir -p "$GRADLE_USER_HOME"
            cat > "$GRADLE_USER_HOME/gradle.properties" <<'EOF'
            org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
            org.gradle.workers.max=1
            org.gradle.parallel=false
            org.gradle.caching=true
            kotlin.compiler.execution.strategy=in-process
            EOF

            echo '--- CI Gradle memory profile ---'
            cat "$GRADLE_USER_HOME/gradle.properties"
            echo '--------------------------------'
            java -version

            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager \
              'platform-tools' \
              'platforms;android-36' \
              'build-tools;36.0.0'

            cd Director
            printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
            chmod +x gradlew
            ./gradlew --version

      - run:
          name: Compile Kotlin first
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director
            mkdir -p /tmp/director-diagnostics

            set +e
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --max-workers=1 \
              compileDebugKotlin \
              2>&1 | tee /tmp/director-diagnostics/compile.log
            RC=${PIPESTATUS[0]}
            set -e

            if [ "$RC" -ne 0 ]; then
              echo
              echo '================ EXACT KOTLIN FAILURE ================'
              grep -nE '^e: |error:|Unresolved reference|Syntax error|Compilation error|OutOfMemory|daemon disappeared|Caused by:|Execution failed|FAILED' \
                /tmp/director-diagnostics/compile.log | tail -n 180 || true
              echo '================ LAST 240 LOG LINES =================='
              tail -n 240 /tmp/director-diagnostics/compile.log || true
              echo '======================================================'
              exit "$RC"
            fi

      - run:
          name: Unit tests, lint and build APK
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director
            mkdir -p /tmp/director-diagnostics

            set +e
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --max-workers=1 \
              testDebugUnitTest \
              lintDebug \
              assembleDebug \
              2>&1 | tee /tmp/director-diagnostics/build.log
            RC=${PIPESTATUS[0]}
            set -e

            if [ "$RC" -ne 0 ]; then
              echo
              echo '================ EXACT GRADLE FAILURE ================'
              grep -nE '^e: |error:|Lint found|Unresolved reference|Syntax error|Compilation error|OutOfMemory|daemon disappeared|Caused by:|Execution failed|FAILED' \
                /tmp/director-diagnostics/build.log | tail -n 200 || true
              echo '================ LAST 280 LOG LINES =================='
              tail -n 280 /tmp/director-diagnostics/build.log || true
              echo '======================================================'
              exit "$RC"
            fi

      - run:
          name: Verify and package APK
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd Director

            APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
            test -n "$APK"
            test -s "$APK"

            BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
            unzip -t "$APK" >/dev/null
            unzip -l "$APK" | grep -qE '(^|[[:space:]])classes\.dex$'

            mkdir -p /tmp/director-artifacts
            cp "$APK" /tmp/director-artifacts/Director-debug.apk
            sha256sum /tmp/director-artifacts/Director-debug.apk \
              | tee /tmp/director-artifacts/Director-debug.apk.sha256

      - run:
          name: Preserve diagnostics
          when: always
          command: |
            mkdir -p /tmp/director-diagnostics
            cp -R "$GRADLE_USER_HOME/daemon" /tmp/director-diagnostics/gradle-daemon-logs 2>/dev/null || true
            if [ -d Director/app/build/reports ]; then
              cp -R Director/app/build/reports /tmp/director-diagnostics/reports || true
            fi
            if [ -d Director/app/build/test-results ]; then
              cp -R Director/app/build/test-results /tmp/director-diagnostics/test-results || true
            fi

      - save_cache:
          key: director-gradle-v4-{{ checksum "Director/gradle.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
            - ~/.gradle/director-wrapper

      - store_test_results:
          path: Director/app/build/test-results

      - store_artifacts:
          path: /tmp/director-artifacts
          destination: director-apk

      - store_artifacts:
          path: /tmp/director-diagnostics
          destination: diagnostics

workflows:
  director-build:
    jobs:
      - build-director-apk:
          filters:
            branches:
              only:
                - director-gemini-v1
