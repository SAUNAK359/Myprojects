[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tridentbrain"
version = "0.1.0"
description = "Unified GNN + CNN + FFN Deep Learning Framework for Multi-Task AI"
authors = [{name = "Saunak Das Chaudhuri"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scikit-learn",
    "requests"
]

[tool.setuptools.packages.find]
where = ["src"]
